name: Update zorVPN Nodes

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'scripts/**'

concurrency:
  group: update-zorvpn
  cancel-in-progress: true

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Mihomo (Clash.Meta) Engine for Real Health Checks
        run: |
          curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz | gzip -d > /tmp/mihomo
          chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Fetch Live Nodes & Run Active Latency Verification
        run: |
          python scripts/update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ZorVPN.yaml clash.yaml ZorVPN.txt ZorVPN-lite.txt ZorVPN-all.txt ZorVPN-nodes.txt
          if git diff --staged --quiet; then
            echo "No changes detected in subscription files"
          else
            git commit -m "chore(subscription): update verified green nodes [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Purge jsDelivr Global CDN Cache (Instant Global Refresh)
        run: |
          for file in ZorVPN.yaml clash.yaml ZorVPN.txt ZorVPN-lite.txt ZorVPN-all.txt ZorVPN-nodes.txt index.html; do
            echo "Purging jsDelivr cache for $file..."
            curl -s "https://purge.jsdelivr.net/gh/hamzawih0/zorVPN@main/$file" || true
          done
